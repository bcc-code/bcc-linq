name: Publish to nuget

# Publishes BccCode.Linq (client) and BccCode.Linq.Server.
# Publishing runs in a separate job from a GitHub environment, which the NuGet.org trusted-publishing policy
# should name, so a job without the environment (e.g. from an edited workflow) cannot publish:
# - a push to main publishes the release <base>.<run> from the `nuget` environment (limit it to main);
# - a pull request from a branch in this repository publishes <base>.<run>-pr<number>, and a run started by
#   hand on a branch publishes <base>.<run>-beta, both from the `nuget-beta` environment. Give that
#   environment required reviewers: the publish job then waits until someone approves it.
# Pull requests from forks only build, test and pack.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/nuget-package-publish.yml"
      - ".github/variables/version.env"

  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/nuget-package-publish.yml"
      - ".github/variables/version.env"

  workflow_dispatch:

permissions:
  contents: read

env:
  CLIENT_CSPROJ_PATH: src/BccCode.Linq/BccCode.Linq.csproj
  SERVER_CSPROJ_PATH: src/BccCode.Linq.Server/BccCode.Linq.Server.csproj

jobs:
  pack:
    name: Test and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set Environment Variables
        uses: ./.github/actions/setvars
        with:
          varFilePath: ./.github/variables/version.env

      - name: Set package version
        run: |
          if [[ $GITHUB_REF == 'refs/heads/main' && $GITHUB_EVENT_NAME == 'push' ]]; then
             echo "VERSION=${{ env.NUGET_PACKAGE_VERSION_BASE }}.${{ github.run_number}}" >> "$GITHUB_ENV"
          elif [[ $GITHUB_EVENT_NAME == 'pull_request' ]]; then
             echo "VERSION=${{ env.NUGET_PACKAGE_VERSION_BASE }}.${{ github.run_number}}-pr${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
          else
             echo "VERSION=${{ env.NUGET_PACKAGE_VERSION_BASE }}.${{ github.run_number}}-beta" >> "$GITHUB_ENV"
          fi

      - name: Run Tests
        run: dotnet test

      - name: Package
        run: |
          dotnet pack -p:PackageVersion=${{ env.VERSION }} -c Release -o package ${{ env.CLIENT_CSPROJ_PATH }}
          dotnet pack -p:PackageVersion=${{ env.VERSION }} -c Release -o package ${{ env.SERVER_CSPROJ_PATH }}

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: package/*.nupkg
          if-no-files-found: error
          retention-days: 7

  aot-smoke-test:
    name: Native AOT smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish with Native AOT
        run: dotnet publish tests/BccCode.Linq.AotSmokeTest -c Release -r linux-x64 -o aot-out

      - name: Run
        run: ./aot-out/BccCode.Linq.AotSmokeTest

  publish:
    name: Publish to NuGet
    # A push to main, a run started by hand, or a pull request from a branch in this repository (never a fork).
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: [pack, aot-smoke-test]
    runs-on: ubuntu-latest
    # Same condition as the release version in `pack`: anything else is a beta and needs `nuget-beta`'s approval.
    environment: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'nuget' || 'nuget-beta' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: package

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Trusted publishing: the NuGet.org account in NUGET_USER needs a policy for this repository and workflow.
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish
        run: |
          dotnet nuget push package/*.nupkg \
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
